services:
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/openchord
      DATABASE_USERNAME: openchord
      DATABASE_PASSWORD: openchord
      MEDIA_ROOT: /media
      PUBLIC_BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - ./media:/media:ro
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openchord
      POSTGRES_USER: openchord
      POSTGRES_PASSWORD: openchord
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openchord -d openchord"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:

services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://openchord:openchord@database:5432/openchord
      MEDIA_ROOT: /media
      PUBLIC_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    volumes:
      - ./media:/media:ro
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openchord
      POSTGRES_USER: openchord
      POSTGRES_PASSWORD: openchord
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openchord -d openchord"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:


[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "open-chord-back"
version = "0.1.0"
description = "Self-hosted OpenChord music server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite==0.20.0",
  "asyncpg==0.30.0",
  "fastapi==0.115.6",
  "pydantic==2.10.5",
  "pydantic-settings==2.7.1",
  "sqlalchemy[asyncio]==2.0.36",
  "strawberry-graphql[fastapi]==0.253.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.14.1",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
  "ruff==0.9.1",
]

[tool.setuptools.packages.find]
include = ["openchord*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["openchord"]
